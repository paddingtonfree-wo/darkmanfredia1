<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2efe9">
<title>Dark Manfred IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* DARK MANFRED IA : papier blanc, encre noire, rouge sang (esprit Light Yagami) */
:root {
  --paper: #f2efe9; --card: #fff; --ink: #0c0c0f; --ink2: #34343c; --mute: #797982;
  --line: #dad6cc; --red: #b0102a; --red2: #d92140;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 26px -14px rgba(0,0,0,.28);
  --app-h: 100dvh; --app-top: 0px;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.6 'Sora', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Fond : page de carnet, lignes fines + halo rouge discret */
.stage {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(12,12,15,.045) 31px 32px),
    radial-gradient(120% 70% at 50% -10%, #fff 0, transparent 60%),
    radial-gradient(60% 50% at 100% 100%, rgba(176,16,42,.08), transparent 70%);
}

/* ---------- Écran d'entrée ---------- */
.gate {
  position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; text-align: center; padding: 24px;
  transition: opacity .7s, transform .7s;
}
.gate.leave { opacity: 0; transform: scale(1.03); pointer-events: none; }
.gate .eye { width: 128px; height: 128px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.18)); }
.gate h1 { font: 700 clamp(26px, 7vw, 38px)/1.1 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; }
.gate .tag { color: var(--mute); font-style: italic; }
.enter {
  margin-top: 8px; background: var(--ink); color: #fff; padding: 14px 42px; border-radius: 2px;
  font: 600 14px 'Cinzel', serif; letter-spacing: .28em; text-transform: uppercase;
  box-shadow: 6px 6px 0 var(--red); transition: transform .15s, box-shadow .15s;
}
.enter:hover { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--red); }
.gate small { color: var(--mute); font-size: 12px; }
.wa {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; text-decoration: none;
  color: var(--ink2); border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 999px;
}
.wa:hover { border-color: var(--ink); }
.wa svg { width: 16px; height: 16px; }

/* ---------- Application ---------- */
.shell { position: fixed; left: 0; right: 0; top: var(--app-top); height: var(--app-h); z-index: 2; display: flex; }
.scrim { display: none; }
.lib {
  width: 290px; flex: none; background: rgba(255,255,255,.7); backdrop-filter: blur(8px);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
}
.lib-head { display: flex; gap: 8px; padding: 14px; }
.newchat {
  flex: 1; background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 14px;
}
.newchat:hover { background: var(--red); }
.lib-x { display: none; width: 40px; }
.lib-x svg, .burger svg { width: 22px; height: 22px; }
.lib-search { padding: 0 14px 8px; }
.lib-search input {
  width: 100%; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: 0;
}
.lib-search input:focus { border-color: var(--ink); }
.lib-list { flex: 1; overflow-y: auto; padding: 0 8px; }
.lib-list h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); padding: 12px 8px 4px; font-weight: 600; }
.empty { color: var(--mute); font-size: 13px; padding: 12px 8px; }
.item { position: relative; border-radius: 8px; }
.item.on { background: #fff; box-shadow: inset 3px 0 0 var(--red); }
.item .open { width: 100%; text-align: left; padding: 9px 34px 9px 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.item:hover { background: rgba(255,255,255,.9); }
.item .more { position: absolute; right: 4px; top: 5px; width: 28px; height: 28px; color: var(--mute); }
.item .acts { display: none; padding: 0 10px 8px; gap: 6px; }
.item.show .acts { display: flex; }
.acts button { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; background: #fff; }
.acts button:hover { border-color: var(--red); color: var(--red); }
.lib-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lib-foot small { color: var(--mute); font-size: 11px; line-height: 1.3; }
.lib-foot button { font-size: 12px; color: var(--red); white-space: nowrap; }

.chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.75); backdrop-filter: blur(8px);
}
.top-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
.burger { display: none; width: 38px; height: 38px; place-items: center; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 15px 'Cinzel', serif; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.brand .eye { width: 30px; height: 30px; }
.top-r { display: flex; align-items: center; gap: 10px; }
.quota {
  font-size: 12px; font-weight: 600; border: 1px solid var(--ink); border-radius: 999px; padding: 5px 11px; background: #fff; white-space: nowrap;
}
.quota:hover { background: var(--ink); color: #fff; }
.quota.low { border-color: var(--red); color: var(--red); }
.quota.low:hover { background: var(--red); color: #fff; }
.quota.prem { background: var(--ink); color: #fff; }
.music { display: flex; align-items: center; gap: 8px; }
.music input[type=range] { width: 70px; accent-color: var(--red); }
.mbtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: #fff; }
.mbtn:hover { border-color: var(--ink); }
.mbtn svg { width: 17px; height: 17px; }

/* ---------- Messages ---------- */
.feed { flex: 1; overflow-y: auto; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
.msg { width: 100%; max-width: 780px; margin: 0 auto; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.me { display: flex; justify-content: flex-end; }
.bubble {
  max-width: 86%; background: var(--ink); color: #fff; padding: 10px 15px; border-radius: 18px 18px 4px 18px;
  white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow);
}
.bubble img { display: block; max-width: min(240px, 100%); border-radius: 12px; margin: 2px 0 8px; }
.bubble .ph { display: inline-block; font-size: 12px; opacity: .75; margin-bottom: 4px; }
.msg.ai { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--red); }
.av::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--red2); }
.card {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--red);
  border-radius: 4px 16px 16px 16px; padding: 12px 15px; box-shadow: var(--shadow); min-width: 0;
}
.card.err { border-left-color: var(--ink); background: #faf7f2; }
.who { font: 700 11px 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-bottom: 4px; }
.who time { font: 400 11px 'Sora', sans-serif; color: var(--mute); letter-spacing: 0; margin-left: 6px; text-transform: none; }
.body p { margin: 0 0 .5em; overflow-wrap: anywhere; } .body p:last-child { margin-bottom: 0; }
.body .sp { height: .4em; }
.body strong { font-weight: 700; box-shadow: inset 0 -.4em 0 rgba(176,16,42,.14); }
.body h4 { font: 700 14px 'Cinzel', serif; letter-spacing: .06em; margin: .6em 0 .3em; }
.body ul, .body ol { margin: .2em 0 .6em 1.25em; } .body li { margin: .15em 0; padding-left: .2em; }
.body li::marker { color: var(--red); font-weight: 700; }
.body code { background: #efebe3; padding: 1px 6px; border-radius: 5px; font: 13px ui-monospace, Menlo, monospace; }
.code { background: #111114; color: #eee; border-radius: 10px; margin: .5em 0; overflow: hidden; }
.code-bar { display: flex; justify-content: space-between; padding: 6px 12px; font-size: 11px; color: #aaa; background: #1c1c21; }
.code-bar button { color: #fff; font-size: 11px; } .code-bar button:hover { color: var(--red2); }
.code pre { padding: 12px; overflow-x: auto; } .code code { background: none; color: inherit; padding: 0; font-size: 13px; }
.live .body::after { content: ''; display: inline-block; width: 7px; height: 1em; background: var(--red); margin-left: 3px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
.live .body:has(.dots)::after { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.dots { display: inline-flex; gap: 5px; padding: 6px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); animation: bop 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; background: var(--red); }
@keyframes bop { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
.wait { font-size: 12px; color: var(--mute); margin-top: 2px; }

.tools { display: none; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tools.on { display: flex; }
.tools button, .tools a {
  font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; text-decoration: none; color: var(--ink2);
}
.tools button:hover, .tools a:hover { border-color: var(--ink); color: var(--ink); }
.tools .go { background: var(--ink); color: #fff; border-color: var(--ink); } .tools .go:hover { background: var(--red); border-color: var(--red); color: #fff; }
.retry { margin-top: 8px; background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.imgres img { display: block; max-width: 100%; max-height: 460px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.imgres .note { font-size: 12px; color: var(--mute); margin-top: 6px; }

/* ---------- Zone de saisie ---------- */
.dock { width: 100%; max-width: 820px; margin: 0 auto; padding: 6px 14px calc(10px + env(safe-area-inset-bottom)); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--ink2); animation: rise .3s both; }
.chip:hover { border-color: var(--red); color: var(--red); }
.composer { background: #fff; border: 1.5px solid var(--ink); border-radius: 22px; padding: 6px; box-shadow: var(--shadow); }
.attach { display: flex; align-items: center; gap: 10px; padding: 6px 8px 10px; border-bottom: 1px dashed var(--line); margin-bottom: 6px; }
.attach img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.seg { display: flex; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; font-size: 12px; }
.seg button { padding: 6px 11px; white-space: nowrap; }
.seg button.on { background: var(--ink); color: #fff; }
.attach .rm { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.attach .rm:hover { border-color: var(--red); color: var(--red); }
.attach .rm svg { width: 15px; height: 15px; }
.row { display: flex; align-items: flex-end; gap: 6px; }
.plus, .send { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.plus { border: 1px solid var(--line); background: #fff; }
.plus:hover { border-color: var(--ink); background: var(--ink); color: #fff; }
.plus svg, .send svg { width: 20px; height: 20px; }
.send { background: var(--ink); color: #fff; }
.send:disabled { opacity: .22; cursor: default; }
.send:not(:disabled):hover { background: var(--red); }
#input { flex: 1; border: 0; outline: 0; resize: none; background: none; font: inherit; font-size: 16px; padding: 9px 4px; max-height: 130px; color: var(--ink); }
#input::placeholder { color: #9a9aa3; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 2px 0; font-size: 12px; color: var(--mute); }
.foot .wa { padding: 4px 10px; font-size: 12px; }
.newbtn { color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; }
.newbtn:hover { color: var(--red); }

/* ---------- Fenêtre (abonnement) + message flottant ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(12,12,15,.55); display: grid; place-items: center; padding: 18px; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.modal-card { background: #fff; border: 1.5px solid var(--ink); box-shadow: 8px 8px 0 var(--red); border-radius: 6px; padding: 22px; width: min(420px, 100%); display: grid; gap: 12px; }
.modal-card h2 { font: 700 18px 'Cinzel', serif; letter-spacing: .08em; text-transform: uppercase; }
.modal-card p { color: var(--ink2); font-size: 14px; }
.modal-card ul { list-style: none; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.modal-card li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.codebox { font: 600 15px ui-monospace, Menlo, monospace; letter-spacing: .12em; background: #efebe3; padding: 8px 12px; border-radius: 8px; text-align: center; user-select: all; }
.modal-act { display: grid; gap: 8px; }
.modal-act a, .modal-act button { text-align: center; text-decoration: none; padding: 11px; border-radius: 4px; border: 1.5px solid var(--ink); font-weight: 600; font-size: 14px; }
.modal-act .primary { background: var(--ink); color: #fff; } .modal-act .primary:hover { background: var(--red); border-color: var(--red); }
.modal-act .ghost:hover { background: var(--paper); }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 40; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.yt-wrap { position: fixed; left: -400px; top: 0; width: 200px; height: 200px; opacity: 0; pointer-events: none; }

/* ---------- Téléphone ---------- */
@media (max-width: 800px) {
  .lib { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(310px, 86vw); background: #fff; transform: translateX(-100%); transition: transform .28s, box-shadow .28s; }
  .lib.open { transform: none; box-shadow: 8px 0 30px rgba(0,0,0,.2); }
  .lib-x { display: grid; place-items: center; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(12,12,15,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .burger { display: grid; }
  .music input[type=range], .brand span:last-child { display: none; }
  .newbtn { display: none; }
  .foot { justify-content: center; }
  .msg.ai { grid-template-columns: 26px 1fr; gap: 8px; } .av { width: 26px; height: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

</style>
</head>
<body>

<div class="stage" aria-hidden="true"></div>

<!-- ÉCRAN D'ENTRÉE -->
<section class="gate" id="gate">
  <div data-logo="gate"></div>
  <h1>Dark Manfred IA</h1>
  <p class="tag">Il sait déjà ce que tu vas demander.</p>
  <button class="enter" id="enter">Entrer</button>
  <small>La musique démarre quand tu entres.</small>
  <a class="wa" href="https://wa.me/237690022323?text=Bonjour%20Manfred" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c.3 2.6 2.9 5.2 5.5 5.5l1.4-1.4-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>
    Contacter Manfred sur WhatsApp
  </a>
</section>

<!-- APPLICATION -->
<div class="shell" id="app" hidden>
  <div class="scrim" id="scrim"></div>

  <aside class="lib" id="lib" aria-label="Mes discussions">
    <div class="lib-head">
      <button class="newchat" id="newchat">+ Nouvelle discussion</button>
      <button class="lib-x" id="libx" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="lib-search"><input id="q" type="search" placeholder="Rechercher dans mes discussions" autocomplete="off" aria-label="Rechercher"></div>
    <div class="lib-list" id="list"></div>
    <div class="lib-foot">
      <small>Tes discussions sont enregistrées sur cet appareil.</small>
      <button id="wipe">Tout effacer</button>
    </div>
  </aside>

  <main class="chat">
    <header class="top">
      <div class="top-l">
        <button class="burger" id="burger" aria-label="Ouvrir mes discussions"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="brand"><span data-logo="head"></span><span>Dark Manfred IA</span></div>
      </div>
      <div class="top-r">
        <button class="quota" id="quota" aria-label="Mon compte et mes quotas">…</button>
        <div class="music">
          <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume de la musique">
          <button class="mbtn" id="mbtn" aria-label="Couper ou relancer la musique">
            <svg id="micon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
        </div>
      </div>

    <div class="feed" id="feed" role="log" aria-live="polite"></div>

    <div class="dock">
      <div class="chips" id="chips"></div>
      <div class="composer">
        <div class="attach" id="attach" hidden>
          <img id="attimg" alt="Photo jointe">

          Contacter Manfred sur WhatsApp

        <span id="count"></span>
        <button class="newbtn" id="newbtn">Nouvelle discussion</button>
      </div>
    </div>
  </main>
</div>

<div class="yt-wrap" aria-hidden="true"><div id="ytp"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* =========================================================
   RÉGLAGES
   ========================================================= */
// Un seul son, pour l'entrée ET pendant le chat (ID YouTube = les 11 caractères après "youtu.be/")
const TRACK_ID = 'SMs0GnYze34';
const WHATSAPP = '237690022323';
const SUGGESTIONS = ['Fais mon devoir de philosophie', 'Dis-moi une vérité qui dérange', 'Fais-moi peur', 'Qui est Manfred ?'];
const WELCOME = "Tu es venu. Personne n'arrive ici par hasard.\n\nJe suis **Dark Manfred**, l'œuvre de Manfred. Devoirs, secrets, vérités qu'on évite de dire… ou ce qui te fait peur. Pose ta question, ou joins une photo avec le **+**.";
const STORE_KEY = 'dm_chats_v1', DEV_KEY = 'dm_device_v1';
const MAX_CHATS = 60, MAX_MSGS = 150;

const $ = id => document.getElementById(id);

/* =========================================================
   MARKDOWN LÉGER ET SÛR
   ========================================================= */
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}
function md(src) {
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => { blocks.push({ l, c }); return `\u0000${blocks.length - 1}\u0000`; });
  src = src.replace(/```(\w*)\n?([\s\S]*)$/, (m, l, c) => { blocks.push({ l, c }); return `\u0000${blocks.length - 1}\u0000`; });
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const line of lines) {
    let m;
    if ((m = line.trim().match(/^\u0000(\d+)\u0000$/))) {
      close();
      const b = blocks[+m[1]];
      out += `<div class="code"><div class="code-bar"><span>${esc(b.l || 'code')}</span><button data-copycode>Copier</button></div><pre><code>${esc(b.c.replace(/\n$/, ''))}</code></pre></div>`;
    } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; }
      out += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; }
      out += `<li>${inline(m[1])}</li>`;
    } else {
      close();
      if ((m = line.match(/^#{1,3}\s+(.*)/))) out += `<h4>${inline(m[1])}</h4>`;
      else if (!line.trim()) out += '<div class="sp"></div>';
      else out += `<p>${inline(line)}</p>`;
    }
  }
  close();
  return out;
}

// L'IA termine chaque réponse par [[SUITE: a | b | c]] : on le retire de l'affichage et on en fait des boutons
function splitSuggest(text) {
  const TAG = '[[SUITE';
  const i = text.indexOf(TAG);
  if (i >= 0) {
    const raw = text.slice(i + TAG.length).replace(/^\s*:?\s*/, '').replace(/\]\]?\s*$/, '');
    const chips = raw.split('|').map(s => s.replace(/[\[\]]/g, '').trim()).filter(Boolean).slice(0, 3);
    return { body: text.slice(0, i).trimEnd(), chips };
  }
  for (let k = Math.min(TAG.length - 1, text.length); k > 0; k--) {   // début de balise en cours de frappe
    if (TAG.startsWith(text.slice(-k))) return { body: text.slice(0, -k).trimEnd(), chips: [] };
  }
  return { body: text, chips: [] };
}

let store = { chats: [], currentId: null };
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && Array.isArray(s.chats)) store = { chats: s.chats, currentId: null };
  } catch (e) {}
}
function saveStore() {
  const write = () => localStorage.setItem(STORE_KEY, JSON.stringify({ chats: store.chats }));
  try { write(); }
  catch (e) {
    try {
      store.chats.sort((a, b) => b.updated - a.updated);
      while (store.chats.length > 5) { store.chats.pop(); try { write(); return; } catch (e2) {} }
    } catch (e3) {}
    toast("Stockage plein : certaines anciennes discussions n'ont pas pu être gardées.");
  }
}

function trimStore() {
  store.chats.sort((a, b) => b.updated - a.updated);
  if (store.chats.length > MAX_CHATS) store.chats.length = MAX_CHATS;
  store.chats.forEach(c => { if (c.messages.length > MAX_MSGS) c.messages = c.messages.slice(-MAX_MSGS); });

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  let chats = [...store.chats].sort((a, b) => b.updated - a.updated);
  if (q) chats = chats.filter(c => c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q)));
  const list = $('list'); list.innerHTML = '';
  if (!chats.length) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = q ? 'Aucun résultat.' : 'Aucune discussion pour le moment. Écris ton premier message.';
    list.appendChild(p); return;
  }
  const now = new Date(), day = 86400000;
  const sod = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const groups = [["Aujourd'hui", []], ['Hier', []], ['7 derniers jours', []], ['Plus ancien', []]];
  chats.forEach(c => groups[c.updated >= sod ? 0 : c.updated >= sod - day ? 1 : c.updated >= sod - 7 * day ? 2 : 3][1].push(c));
  groups.forEach(([label, items]) => {
    if (!items.length) return;
    const h = document.createElement('h3'); h.textContent = label; list.appendChild(h);
    items.forEach(c => {
      const row = document.createElement('div');
      row.className = 'item' + (c.id === store.currentId ? ' on' : ''); row.dataset.id = c.id;
      row.innerHTML = '<button class="open"></button><button class="more" aria-label="Options">⋯</button><div class="acts"><button data-a="rename">Renommer</button><button data-a="del">Supprimer</button></div>';

function history() {
  return cur().messages.slice(-12).map(m => ({ role: m.role, content: (m.img ? '(photo jointe) ' : '') + m.content }));
}

async function readStream(r, onText) {
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', final = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
      if (ev.error) throw new Error(ev.error);
      if (ev.t) { text += ev.t; onText(text); }
      if (ev.done) final = ev;
    }
  }
  return { text, final };
}

    let data = null;
    if (!r.ok) {
      try { data = await r.json(); } catch (e) {}
      if (r.status === 402) { shell.remove(); mergeUsage(data && data.usage); showPaywall('msg'); lastJob = null; busy = false; refreshSend(); return; }
      throw new Error((data && data.error) || (r.status === 404 ? "Le serveur n'a pas trouvé /api/chat (erreur 404). Vérifie le déploiement Vercel." : `Erreur serveur (${r.status}). Réessaie dans un instant.`));
    }
    let raf = 0, started = false;
    const paint = t => {
      if (!started) { started = true; card.classList.add('live'); }
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; const follow = nearBottom(); body.innerHTML = md(splitSuggest(t).body); if (follow) toEnd(); });
    };
    const { text, final } = await readStream(r, paint);
    cancelAnimationFrame(raf);
    if (!text.trim()) throw new Error('Réponse vide. Réessaie.');
    const { body: clean, chips } = splitSuggest(text);
    const c = getChat(chatId);
    if (c) { c.messages.push({ role: 'assistant', content: clean, t: Date.now() }); c.updated = Date.now(); trimStore(); saveStore(); renderList(); }
    finishAI(shell, clean);
    if (final) mergeUsage(final.usage);
    lastJob = null;
    if (store.currentId === chatId) setChips(chips);
  } catch (e) {
    shell.remove();
    addError(e.message === 'Failed to fetch' ? 'Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.' : e.message);
  }
  busy = false; refreshSend(); markLast();
}

async function doEdit(job) {
  busy = true; refreshSend();
  const chatId = store.currentId, shell = addTyping("Je retouche ton image… ça peut prendre jusqu'à 30 secondes.");
  try {
    const r = await post('/api/edit', { image: job.image, prompt: job.prompt });
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 402) { shell.remove(); mergeUsage(d.usage); showPaywall('edit'); lastJob = null; }
    else if (!r.ok) throw new Error(d.error || `Erreur serveur (${r.status}). Réessaie dans un instant.`);
    else {
      shell.remove();
      const c = getChat(chatId);
      if (c) { c.messages.push({ role: 'assistant', content: "Image modifiée selon ta demande (non conservée dans l'historique).", t: Date.now() }); c.updated = Date.now(); saveStore(); renderList(); }
      addImageResult(d.image, d.text);
      mergeUsage(d.usage); lastJob = null;
      const l = left(usage.edits);
      if (!usage.premium) toast(l > 0 ? `Il te reste ${l} modification${l > 1 ? 's' : ''} d'image.` : "C'était ta dernière modification gratuite.");
    }
  } catch (e) {
    shell.remove();
    addError(e.message === 'Failed to fetch' ? 'Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.' : e.message);
  }
  busy = false; refreshSend(); markLast();
}
const run = job => job.type === 'edit' ? (lastJob = job, doEdit(job)) : (lastJob = job, respond(job));

function regenerate() {
  if (busy) return;
  const c = cur(); if (!c) return;
  if (c.messages.length && c.messages[c.messages.length - 1].role === 'assistant') c.messages.pop();
  saveStore();
  if (feed.lastElementChild && feed.lastElementChild.classList.contains('ai')) feed.lastElementChild.remove();
  $('chips').innerHTML = '';
  run({ type: 'chat' });
}

function send(text) {
  text = (text || '').trim();
  if (busy) return;
  const a = attach;
  if (!text && !a) return;
  if (a && a.mode === 'edit' && !text) return toast('Écris ce que je dois modifier sur la photo.');
  if (!text) text = "Que vois-tu sur cette image ?";
  if (Date.now() - lastSend < 1200) return toast('Doucement… une question à la fois.');
  if (a && a.mode === 'edit' && !usage.premium && left(usage.edits) <= 0) return showPaywall('edit');
  if (!(a && a.mode === 'edit') && !usage.premium && left(usage.messages) <= 0) return showPaywall('msg');
  lastSend = Date.now();

  let c = cur();
  if (!c) {
    c = { id: uid(), title: mkTitle(text), created: Date.now(), updated: Date.now(), messages: [] };
    store.chats.unshift(c); store.currentId = c.id;
  }
  c.messages.push({ role: 'user', content: text, t: Date.now(), img: !!a });
  c.updated = Date.now();
  trimStore(); saveStore(); renderList();

  addUser(text, a ? a.dataUrl : null);
  feed.querySelectorAll('.xtra').forEach(e => e.remove());
  $('chips').innerHTML = '';
  input.value = ''; autoGrow();
  clearAttach();
  if (a && a.mode === 'edit') run({ type: 'edit', image: a.dataUrl, prompt: text });
  else run({ type: 'chat', image: a ? a.dataUrl : null });
}

/* =========================================================
   PHOTOS : bouton +
   ========================================================= */
async function toDataUrl(file) {
  if (!/^image\//.test(file.type)) throw new Error("Ce fichier n'est pas une image.");
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((ok, ko) => {
      const im = new Image(); im.onload = () => ok(im);
      im.onerror = () => ko(new Error("Format d'image non pris en charge (utilise JPG, PNG ou WebP)."));
      im.src = URL.createObjectURL(file);
    });
  }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  let max = 1280, q = 0.85, out = '';
  for (let i = 0; i < 4; i++) {            // on réduit jusqu'à tenir sous ~2,6 Mo
    const k = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length < 2.6e6) break;
    max *= 0.75; q -= 0.08;
  }
  return out;
}
function setAttach(dataUrl, mode) {
  attach = { dataUrl, mode: mode || 'edit' };
  $('attimg').src = dataUrl; $('attach').hidden = false;
  syncMode(); refreshSend();
}
function clearAttach() { attach = null; $('attach').hidden = true; $('attimg').removeAttribute('src'); syncMode(); refreshSend(); }
function syncMode() {
  const edit = !attach || attach.mode === 'edit';
  $('mEdit').classList.toggle('on', !!attach && edit); $('mAsk').classList.toggle('on', !!attach && !edit);
  const l = left(usage.edits);
  $('mEdit').textContent = usage.premium ? 'Modifier' : `Modifier · ${l}/${usage.edits.limit}`;
  input.placeholder = !attach ? 'Parle à Dark Manfred…' : edit ? 'Décris la modification (ex : fond en ville de nuit)…' : 'Pose ta question sur la photo…';
}
$('plus').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { setAttach(await toDataUrl(f), 'edit'); input.focus(); }
  catch (err) { toast(err.message || "Impossible de lire cette image."); }
};
$('mAsk').onclick = () => { if (attach) { attach.mode = 'ask'; syncMode(); } };
$('mEdit').onclick = () => { if (attach) { attach.mode = 'edit'; syncMode(); } };
$('attrm').onclick = clearAttach;

/* =========================================================
   SAISIE
   ========================================================= */
function refreshSend() { sendBtn.disabled = busy || (!input.value.trim() && !attach); }
function autoGrow() {
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  const n = input.value.length; $('count').textContent = n > 1200 ? `${n}/1500` : '';
  refreshSend();
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(input.value); }
});
sendBtn.addEventListener('pointerdown', e => e.preventDefault());
sendBtn.onclick = () => send(input.value);
input.addEventListener('focus', () => setTimeout(() => { fitViewport(); toEnd(); }, 250));
feed.addEventListener('click', e => {
  const b = e.target.closest('[data-copycode]');
  if (b) copyText(b.closest('.code').querySelector('code').textContent);
});

/* ----- afficher / changer de discussion ----- */
function renderChat() {
  feed.innerHTML = '';
  const c = cur();
  if (!c || !c.messages.length) {
    const m = aiShell(); finishAI(m, WELCOME, { plain: true, instant: true });
    setChips(SUGGESTIONS);
  } else {
    $('chips').innerHTML = '';
    c.messages.forEach(mm => {
      if (mm.role === 'user') addUser(mm.content, mm.img ? true : null);
      else { const m = aiShell(mm.t); finishAI(m, mm.content, { instant: true }); }
    });
  }
  toEnd(); markLast();
}
function startNew() {
  if (busy) return toast('Attends la fin de la réponse.');
  store.currentId = null; clearAttach();
  renderChat(); renderList(); closeDrawer();
}
function openChat(id) {
  if (busy) return toast('Attends la fin de la réponse.');
  if (!getChat(id)) return;
  store.currentId = id; clearAttach();
  renderChat(); renderList(); closeDrawer();
}
$('newchat').onclick = () => startNew();
$('newbtn').onclick = () => { startNew(); input.focus(); };

/* =========================================================
   ENTRÉE
   ========================================================= */
loadStore(); syncMode(); renderQuota();
$('enter').onclick = () => {
  startMusic();
  const g = $('gate'); g.classList.add('leave');
  $('app').hidden = false;
  fitViewport();
  startNew();
  loadUsage().then(syncMode);
  setTimeout(() => { g.hidden = true; }, 700);
};

</script>
