<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07050c">
<title>Dark Manfred IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07050c;
  --crypt:#120b20;
  --ember:#ff2e4f;
  --violet:#9b3dff;
  --bone:#efe8f5;
  --mist:#9a8fb0;
  --line:rgba(155,61,255,.28);
  --display:'Cinzel',Georgia,serif;
  --body:'Sora',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;background:var(--void);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:8px}

/* ===== Décor : projecteurs, braises (léger : uniquement transform/opacity) ===== */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:strict}
.beams{position:absolute;inset:-35%;will-change:transform;transform-origin:50% 0;animation:sweep 24s ease-in-out infinite alternate;
  background:conic-gradient(from 0deg at 50% 0%,
    transparent 0 4%, rgba(155,61,255,.08) 6.5%, rgba(155,61,255,.30) 9.5%, rgba(155,61,255,.08) 12.5%, transparent 15% 34%,
    rgba(255,46,79,.07) 36.5%, rgba(255,46,79,.26) 39.5%, rgba(255,46,79,.07) 42.5%, transparent 45% 64%,
    rgba(155,61,255,.06) 66.5%, rgba(155,61,255,.22) 69.5%, rgba(155,61,255,.06) 72.5%, transparent 75%)}
.beams.b2{animation-duration:33s;animation-direction:alternate-reverse;opacity:.65;
  background:conic-gradient(from 20deg at 50% 0%, transparent 0 18%, rgba(255,46,79,.07) 21%, rgba(255,46,79,.22) 24%, rgba(255,46,79,.07) 27% 56%, rgba(155,61,255,.08) 59%, rgba(155,61,255,.24) 62%, rgba(155,61,255,.08) 65%, transparent 68%)}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#embers{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 120%,rgba(255,46,79,.20),transparent 55%),
  radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(7,5,12,.85) 100%)}
/* Quand on écrit : on met les animations en pause pour que la frappe reste fluide */
body.typing .beams{animation-play-state:paused}
@media (max-width:700px){.beams.b2{display:none}}

/* ===== Écran d'entrée ===== */
.gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 24px 90px;text-align:center;transition:opacity .7s ease,transform .7s ease}
.gate.leave{opacity:0;transform:scale(1.06);pointer-events:none}
.gate .eye{width:min(46vw,210px);height:auto;filter:drop-shadow(0 0 28px rgba(255,46,79,.55)) drop-shadow(0 0 60px rgba(155,61,255,.45))}
.gate h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,64px);letter-spacing:.06em;line-height:1.05;
  background:linear-gradient(180deg,#fff 10%,#f6b6c6 55%,#c8a0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,46,79,.5));animation:ignite 1.8s steps(1,end) 1}
@keyframes ignite{0%{opacity:0}8%{opacity:1}12%{opacity:.1}18%{opacity:1}26%{opacity:.25}34%{opacity:1}60%{opacity:.6}66%{opacity:1}100%{opacity:1}}
.gate p.tag{color:var(--mist);max-width:30ch;font-size:16px}
.enter{margin-top:6px;padding:15px 46px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.14em;
  background:linear-gradient(135deg,var(--ember),var(--violet));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 34px rgba(255,46,79,.5),0 0 70px rgba(155,61,255,.35);
  transition:transform .2s,box-shadow .2s}
.enter:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 44px rgba(255,46,79,.7),0 0 90px rgba(155,61,255,.5)}
.gate small{color:var(--mist);font-size:12.5px}

/* ===== Bouton WhatsApp ===== */
.wa{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:500;line-height:1.2;
  border:1px solid rgba(37,211,102,.45);background:rgba(37,211,102,.08);color:#c9f7da;transition:background .2s,box-shadow .2s}
.wa:hover{background:rgba(37,211,102,.16);box-shadow:0 0 22px rgba(37,211,102,.35)}
.wa svg{flex:none;width:18px;height:18px;fill:none;stroke:#3fe283;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gate .wa{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));font-size:13.5px;padding:10px 18px}

/* ===== Structure : bibliothèque + chat. La hauteur suit le clavier (--app-h) ===== */
.shell{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100dvh);z-index:2;display:flex}
.scrim{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}

/* ----- Bibliothèque des discussions ----- */
.lib{position:absolute;z-index:10;top:0;bottom:0;left:0;width:min(86vw,320px);display:flex;flex-direction:column;
  background:#0c0716;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-top:env(safe-area-inset-top)}
.lib.open{transform:none}
.lib-head{padding:14px 14px 8px;display:flex;gap:8px;align-items:center}
.newchat{flex:1;padding:11px 14px;border-radius:12px;font-weight:600;font-size:14px;text-align:left;
  background:linear-gradient(135deg,rgba(255,46,79,.28),rgba(155,61,255,.28));border:1px solid var(--line);transition:box-shadow .2s}
.newchat:hover{box-shadow:0 0 20px rgba(255,46,79,.4)}
.lib-x{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)}
.lib-search{padding:4px 14px 10px}
.lib-search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(155,61,255,.07);color:var(--bone);font:inherit;font-size:16px;outline:0}
.lib-search input:focus{border-color:var(--ember)}
.lib-list{flex:1;overflow-y:auto;padding:0 8px 8px;overscroll-behavior:contain}
.lib-list h3{font-size:11.5px;font-weight:600;color:var(--mist);padding:14px 10px 6px;letter-spacing:.04em}
.lib-list .empty{padding:20px 12px;color:var(--mist);font-size:13.5px}
.item{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;border-radius:10px}
.item:hover,.item.on{background:rgba(155,61,255,.16)}
.item.on{box-shadow:inset 2px 0 0 var(--ember)}
.item .open{padding:10px 10px;text-align:left;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.item .more{width:36px;height:36px;border-radius:8px;color:var(--mist);font-size:18px;line-height:1}
.item .more:hover{color:var(--bone)}
.item .acts{grid-column:1/-1;display:none;gap:8px;padding:0 10px 10px}
.item.show .acts{display:flex}
.acts button{flex:1;padding:7px 10px;border-radius:8px;font-size:13px;border:1px solid var(--line)}
.acts button:hover{border-color:var(--ember)}
.acts button[data-a=del]{color:#ff8fa3}
.lib-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lib-foot small{color:var(--mist);font-size:12px}
.lib-foot button{text-align:left;font-size:13px;color:#ff8fa3;padding:4px 0}

/* ----- Chat ----- */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(8,5,14,.92)}
.top-l{display:flex;align-items:center;gap:8px;min-width:0}
.burger{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(155,61,255,.1)}
.burger svg,.music svg,.lib-x svg{width:20px;height:20px;fill:none;stroke:var(--bone);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;min-width:0;white-space:nowrap}
.brand .eye{flex:none;width:32px;height:32px;filter:drop-shadow(0 0 8px rgba(255,46,79,.6))}
.music{display:flex;align-items:center;gap:10px;color:var(--mist);font-size:12.5px}
.music button.mbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(155,61,255,.1)}
.music .np{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music input[type=range]{width:70px;accent-color:var(--ember)}
@media (max-width:700px){.music .np,.music input[type=range]{display:none}.brand span:last-child{font-size:15px}}
@media (min-width:900px){
  .lib{position:relative;transform:none;flex:none;width:300px}
  .burger,.lib-x,.scrim{display:none}
}

.feed{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 14px 10px;display:flex;flex-direction:column;gap:16px}
.feed>*{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
.feed::-webkit-scrollbar{width:6px}.feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

.msg{display:flex;gap:10px}
.msg.me{justify-content:flex-end}
.bubble{max-width:82%;padding:10px 14px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,rgba(155,61,255,.4),rgba(255,46,79,.28));border:1px solid rgba(255,255,255,.1);white-space:pre-wrap;word-break:break-word}
.av{flex:none;width:30px;height:30px;border-radius:50%;margin-top:2px;position:relative;
  background:radial-gradient(circle at 50% 50%,var(--ember) 0 34%,#5a1d8f 62%,#120a20 100%);box-shadow:0 0 12px rgba(255,46,79,.5)}
.av::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:14px;margin:-7px 0 0 -2px;border-radius:50%;background:#000}
.card{position:relative;min-width:0;flex:1;max-width:calc(100% - 40px);padding:11px 15px 9px;border-radius:4px 18px 18px 18px;
  background:linear-gradient(180deg,rgba(26,15,44,.95),rgba(14,9,26,.95));border:1px solid var(--line);border-left:2px solid var(--ember);
  box-shadow:0 0 30px -14px rgba(155,61,255,.8),-6px 0 20px -14px rgba(255,46,79,.8)}
.card.live::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 34px rgba(155,61,255,.75);opacity:.25;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.85}}
.who{display:flex;align-items:baseline;gap:10px;margin-bottom:3px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;color:#ff8fa3}
.who time{font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--mist);letter-spacing:0}
.body{word-break:break-word}
.body p{margin:0 0 6px}
.body p:last-child{margin-bottom:0}
.body .sp{height:6px}
.body strong{color:#fff}
.body em{color:#d9c2ff}
.body ul,.body ol{margin:4px 0 8px 20px}
.body li{margin:2px 0}
.body h4{font-family:var(--display);font-size:15px;margin:8px 0 4px;color:#ffb3c1}
.body code{font-size:13px;padding:1px 6px;border-radius:6px;background:rgba(155,61,255,.18);color:#e9d8ff}
.code{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0614}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:rgba(155,61,255,.14);font-size:12px;color:var(--mist)}
.code-bar button{font-size:12px;color:var(--bone);padding:2px 8px;border-radius:6px}
.code-bar button:hover{background:rgba(255,255,255,.1)}
.code pre{padding:10px 14px;overflow-x:auto}
.code pre code{padding:0;background:none;font-size:13px;color:#f1e8ff}
.tools{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .4s}
.tools.on{opacity:1}
.tools button{font-size:12px;color:var(--mist);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.tools button:hover{color:var(--bone);border-color:var(--ember)}
.dots{display:flex;gap:6px;padding:8px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s;background:var(--violet)}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.err{border-left-color:#ffb020}
.err .retry{margin-top:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--ember);font-size:13px}
.err .retry:hover{background:rgba(255,46,79,.15)}

/* ===== Zone de saisie ===== */
.dock{flex:none;padding:6px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(7,5,12,.97) 70%,rgba(7,5,12,0))}
.dock>*{max-width:820px;margin-left:auto;margin-right:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(155,61,255,.1);color:var(--bone);transition:border-color .2s}
.chip:hover{border-color:var(--ember)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;border-radius:24px;border:1px solid var(--line);background:rgba(18,11,32,.96);transition:border-color .2s}
.composer:focus-within{border-color:var(--ember)}
textarea{flex:1;min-width:0;resize:none;max-height:130px;background:none;border:0;outline:0;color:var(--bone);font:inherit;font-size:16px;line-height:1.45;padding:9px 0}
textarea::placeholder{color:#6f6488}
.send{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ember),var(--violet));box-shadow:0 0 18px rgba(255,46,79,.45);transition:transform .15s,opacity .2s}
.send:active:not(:disabled){transform:scale(.92)}
.send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.foot .newbtn{font-size:12.5px;color:var(--mist);padding:6px 10px;border-radius:8px;white-space:nowrap}
.foot .newbtn:hover{color:var(--bone)}
.count{font-size:11.5px;color:var(--mist)}
/* Clavier ouvert sur petit écran : on libère la place pour écrire */
@media (max-width:700px){body.typing .foot,body.typing .chips{display:none}}

/* ===== Divers ===== */
.yt-wrap{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-14px);z-index:30;padding:10px 18px;border-radius:12px;background:#1d1030;border:1px solid var(--ember);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .beams,.gate h1,.card.live::before,.dots i{animation:none}
}
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="beams"></div>
  <div class="beams b2"></div>
  <canvas id="embers"></canvas>
  <div class="vignette"></div>
</div>

<!-- ÉCRAN D'ENTRÉE -->
<section class="gate" id="gate">
  <div data-logo="gate"></div>
  <h1>Dark Manfred IA</h1>
  <p class="tag">Il sait déjà ce que tu vas demander.</p>
  <button class="enter" id="enter">Entrer</button>
  <small>La musique démarre quand tu entres.</small>
  <a class="wa" href="https://wa.me/237690022323?text=Bonjour%20Manfred" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c.3 2.6 2.9 5.2 5.5 5.5l1.4-1.4-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>
    Contacter Manfred sur WhatsApp
  </a>
</section>

<!-- APPLICATION -->
<div class="shell" id="app" hidden>
  <div class="scrim" id="scrim"></div>

  <!-- Bibliothèque -->
  <aside class="lib" id="lib" aria-label="Mes discussions">
    <div class="lib-head">
      <button class="newchat" id="newchat">+ Nouvelle discussion</button>
      <button class="lib-x" id="libx" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="lib-search"><input id="q" type="search" placeholder="Rechercher dans mes discussions" autocomplete="off" aria-label="Rechercher"></div>
    <div class="lib-list" id="list"></div>
    <div class="lib-foot">
      <small>Tes discussions sont enregistrées sur cet appareil.</small>
      <button id="wipe">Tout effacer</button>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <header class="top">
      <div class="top-l">
        <button class="burger" id="burger" aria-label="Ouvrir mes discussions"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="brand"><span data-logo="head"></span><span>Dark Manfred IA</span></div>
      </div>
      <div class="music">
        <span class="np" id="np"></span>
        <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume de la musique">
        <button class="mbtn" id="mbtn" aria-label="Couper ou relancer la musique">
          <svg id="micon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </div>
    </header>

    <div class="feed" id="feed" role="log" aria-live="polite"></div>

    <div class="dock">
      <div class="chips" id="chips"></div>
      <div class="composer">
        <textarea id="input" rows="1" maxlength="1500" placeholder="Parle à Dark Manfred…" aria-label="Ton message" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
        <button class="send" id="send" aria-label="Envoyer" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
      <div class="foot">
        <a class="wa" href="https://wa.me/237690022323?text=Bonjour%20Manfred" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c.3 2.6 2.9 5.2 5.5 5.5l1.4-1.4-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>
          Contacter Manfred sur WhatsApp
        </a>
        <span class="count" id="count"></span>
        <button class="newbtn" id="newbtn">Nouvelle discussion</button>
      </div>
    </div>
  </main>
</div>

<div class="yt-wrap" aria-hidden="true"><div id="ytp"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   RÉGLAGES
   ========================================================= */
// ID YouTube = les 11 caractères après "youtu.be/" (avant le "?")
const TRACKS = {
  theme: { id: 'WCTjFHyvEaM', title: 'Bad Boy · ultra slowed' },   // à l'entrée du site
  chat:  { id: 'mTwbInnoqLQ', title: 'Musique du chat' }            // dès qu'on parle à l'IA (change le titre si tu veux)
};
const API_URL = '/chat';
const SUGGESTIONS = ['Fais mon devoir de philosophie', 'Dis-moi une vérité qui dérange', 'Fais-moi peur', 'Qui est Manfred ?'];
const WELCOME = "Tu es venu. Personne n'arrive ici par hasard.\n\nJe suis **Dark Manfred**, l'œuvre de Manfred. Devoirs, secrets, vérités qu'on évite de dire… ou ce qui te fait peur. Pose ta question.";
const STORE_KEY = 'dm_chats_v1';
const MAX_CHATS = 60, MAX_MSGS = 150;

const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   HAUTEUR QUI SUIT LE CLAVIER (le champ de saisie ne se cache plus)
   ========================================================= */
function fitViewport() {
  const vv = window.visualViewport;
  root.style.setProperty('--app-h', (vv ? vv.height : innerHeight) + 'px');
  root.style.setProperty('--app-top', (vv ? vv.offsetTop : 0) + 'px');
}
fitViewport();
addEventListener('resize', fitViewport);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', () => { fitViewport(); if (document.activeElement === $('input')) requestAnimationFrame(toEnd); });
  visualViewport.addEventListener('scroll', fitViewport);
}

/* =========================================================
   LOGO (œil dont la pupille suit le curseur)
   ========================================================= */
let logoN = 0;
function logoSVG() {
  const u = 'l' + (++logoN);
  return `<svg class="eye" viewBox="0 0 200 200" role="img" aria-label="Logo Dark Manfred IA">
  <defs>
    <linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e4f"/><stop offset="1" stop-color="#9b3dff"/></linearGradient>
    <radialGradient id="${u}i" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5a73"/><stop offset=".55" stop-color="#c3204a"/><stop offset="1" stop-color="#4a1580"/></radialGradient>
    <clipPath id="${u}c"><path d="M18 100Q100 26 182 100Q100 174 18 100Z"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#${u}g)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#${u}g)" stroke-width="1" stroke-dasharray="3 7" opacity=".7"/>
  <g stroke="url(#${u}g)" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M100 4V22M100 196V178M4 100H22M196 100H178"/>
    <path d="M32 32l12 12M168 32l-12 12M32 168l12-12M168 168l-12-12" opacity=".6"/>
  </g>
  <path d="M18 100Q100 26 182 100Q100 174 18 100Z" fill="#0b0615" stroke="url(#${u}g)" stroke-width="3.5"/>
  <g clip-path="url(#${u}c)">
    <g class="look">
      <circle cx="100" cy="100" r="36" fill="url(#${u}i)"/>
      <circle cx="100" cy="100" r="36" fill="none" stroke="#ff8fa3" stroke-width="1" opacity=".6"/>
      <ellipse cx="100" cy="100" rx="7" ry="27" fill="#000"/>
      <circle cx="88" cy="88" r="5" fill="#fff" opacity=".8"/>
    </g>
  </g>
</svg>`;
}
document.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = logoSVG(); });
if (matchMedia('(pointer:fine)').matches) {
  const eyes = [...document.querySelectorAll('.eye')];
  let px = 0, py = 0, pend = false;
  addEventListener('pointermove', e => {
    px = e.clientX; py = e.clientY;
    if (pend) return; pend = true;
    requestAnimationFrame(() => {
      pend = false;
      eyes.forEach(svg => {
        const r = svg.getBoundingClientRect();
        if (!r.width) return;
        const dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 280);
        svg.querySelector('.look').style.transform = `translate(${dx / d * 16 * k}px,${dy / d * 8 * k}px)`;
      });
    });
  }, { passive: true });
}

/* =========================================================
   BRAISES (canvas léger : sprites pré-dessinés, 30 images/s, pause pendant la frappe)
   ========================================================= */
(function () {
  const c = $('embers'), x = c.getContext('2d');
  let w, h; const ps = [];
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; };
  size(); addEventListener('resize', size);
  const sprite = rgb => {
    const s = document.createElement('canvas'); s.width = s.height = 32;
    const g = s.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.35, `rgba(${rgb},.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return s;
  };
  const sp = [sprite('255,46,79'), sprite('155,61,255')];
  const mk = init => ({ x: Math.random() * w, y: init ? Math.random() * h : h + 10, s: Math.random() * 10 + 5, v: Math.random() * .5 + .15, d: Math.random() * 6.28, i: Math.random() < .6 ? 0 : 1, a: Math.random() * .6 + .3 });
  const N = innerWidth < 700 ? 18 : 34;
  for (let i = 0; i < N; i++) ps.push(mk(true));
  let last = 0;
  (function frame(t) {
    requestAnimationFrame(frame);
    if (reduceMotion || document.hidden || document.body.classList.contains('typing') || t - last < 33) return;
    last = t;
    x.clearRect(0, 0, w, h);
    for (const p of ps) {
      p.y -= p.v * 2; p.d += .02; p.x += Math.sin(p.d) * .5;
      if (p.y < -20) Object.assign(p, mk(false));
      x.globalAlpha = p.a;
      x.drawImage(sp[p.i], p.x, p.y, p.s, p.s);
    }
  })(0);
})();

/* =========================================================
   MUSIQUE (lecteur YouTube invisible)
   ========================================================= */
let yt = null, ytReady = false, wantPlay = false, userPaused = false, current = 'theme', vol = 70;

(function loadYT() { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('ytp', {
    width: '200', height: '200', videoId: TRACKS.theme.id,
    playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0 },
    events: {
      onReady: () => { ytReady = true; yt.setVolume(vol); if (wantPlay) yt.playVideo(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { yt.seekTo(0); yt.playVideo(); }
        updateMusicUI();
      },
      onError: () => toast("Cette musique ne peut pas être lue sur le site (lecture bloquée par YouTube).")
    }
  });
};
function startMusic() { userPaused = false; if (ytReady) yt.playVideo(); else wantPlay = true; updateMusicUI(); }
function switchTrack(key) {
  const t = TRACKS[key];
  if (!t || !t.id || key === current) return;
  current = key;
  $('np').textContent = t.title;
  if (!ytReady) return;
  if (userPaused) yt.cueVideoById(t.id); else yt.loadVideoById(t.id);
}
function updateMusicUI() {
  const playing = ytReady && yt.getPlayerState && yt.getPlayerState() === 1;
  $('micon').innerHTML = playing
    ? '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
    : '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/>';
}
$('mbtn').onclick = () => {
  if (!ytReady) return;
  if (yt.getPlayerState() === 1) { userPaused = true; yt.pauseVideo(); } else { userPaused = false; yt.playVideo(); }
  setTimeout(updateMusicUI, 200);
};
$('vol').oninput = e => { vol = +e.target.value; if (ytReady) yt.setVolume(vol); };

/* =========================================================
   RENDU DES MESSAGES (Markdown léger et sûr)
   ========================================================= */
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}
function md(src) {
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => { blocks.push({ l, c }); return `\u0000${blocks.length - 1}\u0000`; });
  src = src.replace(/```(\w*)\n?([\s\S]*)$/, (m, l, c) => { blocks.push({ l, c }); return `\u0000${blocks.length - 1}\u0000`; });
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const line of lines) {
    let m;
    if ((m = line.trim().match(/^\u0000(\d+)\u0000$/))) {
      close();
      const b = blocks[+m[1]];
      out += `<div class="code"><div class="code-bar"><span>${esc(b.l || 'code')}</span><button data-copycode>Copier</button></div><pre><code>${esc(b.c.replace(/\n$/, ''))}</code></pre></div>`;
    } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; }
      out += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; }
      out += `<li>${inline(m[1])}</li>`;
    } else {
      close();
      if ((m = line.match(/^#{1,3}\s+(.*)/))) out += `<h4>${inline(m[1])}</h4>`;
      else if (!line.trim()) out += '<div class="sp"></div>';
      else out += `<p>${inline(line)}</p>`;
    }
  }
  close();
  return out;
}

/* =========================================================
   BIBLIOTHÈQUE (enregistrée dans le navigateur de chaque personne)
   ========================================================= */
let store = { chats: [], currentId: null };
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && Array.isArray(s.chats)) store = { chats: s.chats, currentId: null };
  } catch (e) {}
}
function saveStore() {
  const write = () => localStorage.setItem(STORE_KEY, JSON.stringify({ chats: store.chats }));
  try { write(); }
  catch (e) {
    // stockage plein : on retire les plus anciennes discussions et on réessaie
    try {
      store.chats.sort((a, b) => b.updated - a.updated);
      while (store.chats.length > 5) { store.chats.pop(); try { write(); return; } catch (e2) {} }
    } catch (e3) {}
    toast("Stockage plein : certaines anciennes discussions n'ont pas pu être gardées.");
  }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const getChat = id => store.chats.find(c => c.id === id) || null;
const cur = () => getChat(store.currentId);
const mkTitle = t => { t = t.replace(/\s+/g, ' ').trim(); return t.length > 42 ? t.slice(0, 42) + '…' : t; };

function trimStore() {
  store.chats.sort((a, b) => b.updated - a.updated);
  if (store.chats.length > MAX_CHATS) store.chats.length = MAX_CHATS;
  store.chats.forEach(c => { if (c.messages.length > MAX_MSGS) c.messages = c.messages.slice(-MAX_MSGS); });
}

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  let chats = [...store.chats].sort((a, b) => b.updated - a.updated);
  if (q) chats = chats.filter(c => c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q)));
  const list = $('list'); list.innerHTML = '';
  if (!chats.length) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = q ? 'Aucun résultat.' : 'Aucune discussion pour le moment. Écris ton premier message.';
    list.appendChild(p); return;
  }
  const now = new Date(), day = 86400000;
  const sod = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const groups = [['Aujourd\'hui', []], ['Hier', []], ['7 derniers jours', []], ['Plus ancien', []]];
  chats.forEach(c => groups[c.updated >= sod ? 0 : c.updated >= sod - day ? 1 : c.updated >= sod - 7 * day ? 2 : 3][1].push(c));
  groups.forEach(([label, items]) => {
    if (!items.length) return;
    const h = document.createElement('h3'); h.textContent = label; list.appendChild(h);
    items.forEach(c => {
      const row = document.createElement('div');
      row.className = 'item' + (c.id === store.currentId ? ' on' : ''); row.dataset.id = c.id;
      row.innerHTML = '<button class="open"></button><button class="more" aria-label="Options">⋯</button><div class="acts"><button data-a="rename">Renommer</button><button data-a="del">Supprimer</button></div>';
      row.querySelector('.open').textContent = c.title;
      list.appendChild(row);
    });
  });
}

$('list').addEventListener('click', e => {
  const row = e.target.closest('.item'); if (!row) return;
  const id = row.dataset.id;
  if (e.target.closest('.open')) return openChat(id);
  if (e.target.closest('.more')) return row.classList.toggle('show');
  const a = e.target.closest('[data-a]'); if (!a) return;
  const c = getChat(id); if (!c) return;
  if (a.dataset.a === 'rename') {
    const t = prompt('Nouveau nom de la discussion :', c.title);
    if (t && t.trim()) { c.title = mkTitle(t); saveStore(); renderList(); }
  } else if (confirm('Supprimer cette discussion ?')) {
    store.chats = store.chats.filter(x => x.id !== id);
    saveStore();
    if (store.currentId === id) startNew(); else renderList();
  }
});
$('q').addEventListener('input', renderList);
$('wipe').onclick = () => {
  if (!store.chats.length || busy) return;
  if (confirm('Effacer toutes tes discussions ? Cette action est définitive.')) { store.chats = []; saveStore(); startNew(); }
};

/* ----- tiroir (mobile) ----- */
const openDrawer = () => { $('lib').classList.add('open'); $('scrim').classList.add('on'); };
const closeDrawer = () => { $('lib').classList.remove('open'); $('scrim').classList.remove('on'); };
$('burger').onclick = openDrawer;
$('libx').onclick = closeDrawer;
$('scrim').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* =========================================================
   CHAT
   ========================================================= */
const feed = $('feed'), input = $('input'), sendBtn = $('send');
let busy = false, switched = false, lastSend = 0;

const timeOf = t => new Date(t || Date.now()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const nearBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
function toEnd() { feed.scrollTop = feed.scrollHeight; }

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3800);
}
function copyText(t) {
  if (navigator.clipboard) return navigator.clipboard.writeText(t).then(() => toast('Copié'), () => toast('Copie impossible'));
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); toast('Copié'); } catch (e) { toast('Copie impossible'); }
  a.remove();
}

function addUser(text) {
  const m = document.createElement('article'); m.className = 'msg me';
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  m.appendChild(b); feed.appendChild(m); toEnd();
}
function aiShell(t) {
  const m = document.createElement('article'); m.className = 'msg ai';
  m.innerHTML = `<div class="av" aria-hidden="true"></div><div class="card"><div class="who">Dark Manfred <time>${timeOf(t)}</time></div><div class="body"></div><div class="tools"></div></div>`;
  feed.appendChild(m);
  return m;
}
function addTyping() {
  const m = aiShell(); m.querySelector('.card').classList.add('live');
  m.querySelector('.body').innerHTML = '<div class="dots" aria-label="Dark Manfred écrit"><i></i><i></i><i></i></div>';
  toEnd(); return m;
}
// Écrit la réponse lettre par lettre (≈20 mises à jour par seconde, léger pour le téléphone)
function addAI(text, existing, opts = {}) {
  return new Promise(resolve => {
    const m = existing || aiShell(opts.t);
    const card = m.querySelector('.card'), body = m.querySelector('.body'), tools = m.querySelector('.tools');
    const finish = () => {
      body.innerHTML = md(text); card.classList.remove('live');
      tools.innerHTML = '<button data-copy>Copier</button>'; tools.classList.add('on');
      tools.querySelector('[data-copy]').onclick = () => copyText(text);
      if (nearBottom() || opts.instant) toEnd();
      resolve();
    };
    if (opts.instant || reduceMotion) return finish();
    card.classList.add('live');
    let i = 0, stop = false;
    const step = Math.max(3, Math.ceil(text.length / 70));
    card.addEventListener('click', () => { stop = true; }, { once: true });
    const timer = setInterval(() => {
      if (stop || i >= text.length) { clearInterval(timer); return finish(); }
      i = Math.min(text.length, i + step);
      const follow = nearBottom();
      body.innerHTML = md(text.slice(0, i));
      if (follow) toEnd();
    }, 50);
  });
}
function addError(msg) {
  const m = aiShell(); m.querySelector('.card').classList.add('err');
  m.querySelector('.body').innerHTML = `<p>${esc(msg)}</p><button class="retry">Réessayer</button>`;
  m.querySelector('.retry').onclick = () => { if (busy) return; m.remove(); respond(); };
  toEnd();
}

async function ask() {
  const c = cur();
  const msgs = c.messages.slice(-12).map(m => ({ role: m.role, content: m.content }));
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: msgs }) });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || (r.status === 404
    ? "Le serveur n'a pas trouvé l'adresse du chat (erreur 404). Vérifie que server.js et chat.js sont bien déployés."
    : `Erreur serveur (${r.status}). Réessaie dans un instant.`));
  return data.reply;
}
async function respond() {
  busy = true; refreshSend();
  const chatId = store.currentId;
  const typing = addTyping();
  try {
    const reply = await ask();
    const c = getChat(chatId);
    if (c) { c.messages.push({ role: 'assistant', content: reply, t: Date.now() }); c.updated = Date.now(); trimStore(); saveStore(); renderList(); }
    await addAI(reply, typing);
  } catch (e) {
    typing.remove();
    addError(e.message === 'Failed to fetch' ? 'Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.' : e.message);
  }
  busy = false; refreshSend();
}

function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  if (Date.now() - lastSend < 1200) return toast('Doucement… une question à la fois.');
  lastSend = Date.now();

  let c = cur();
  if (!c) {
    c = { id: uid(), title: mkTitle(text), created: Date.now(), updated: Date.now(), messages: [] };
    store.chats.unshift(c); store.currentId = c.id;
  }
  c.messages.push({ role: 'user', content: text, t: Date.now() });
  c.updated = Date.now();
  trimStore(); saveStore(); renderList();

  addUser(text);
  $('chips').innerHTML = '';
  input.value = ''; autoGrow();
  if (!switched) { switched = true; switchTrack('chat'); }
  respond();
}

function refreshSend() { sendBtn.disabled = busy || !input.value.trim(); }
function autoGrow() {
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  const n = input.value.length; $('count').textContent = n > 1200 ? `${n}/1500` : '';
  refreshSend();
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  // Ordinateur : Entrée envoie (Maj+Entrée = nouvelle ligne). Téléphone : Entrée = nouvelle ligne, on envoie avec la flèche.
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(input.value); }
});
sendBtn.addEventListener('pointerdown', e => e.preventDefault()); // garde le clavier ouvert quand on envoie
sendBtn.onclick = () => send(input.value);

// Clavier ouvert : on met les animations en pause et on garde le dernier message visible
input.addEventListener('focus', () => {
  document.body.classList.add('typing');
  setTimeout(() => { fitViewport(); toEnd(); }, 250);
});
input.addEventListener('blur', () => setTimeout(() => {
  if (document.activeElement !== input) document.body.classList.remove('typing');
}, 150));

feed.addEventListener('click', e => {
  const b = e.target.closest('[data-copycode]');
  if (b) copyText(b.closest('.code').querySelector('code').textContent);
});

function showChips() {
  const c = $('chips'); c.innerHTML = '';
  SUGGESTIONS.forEach(s => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = s; b.onclick = () => send(s); c.appendChild(b); });
}

/* ----- afficher / changer de discussion ----- */
function renderChat(opts = {}) {
  feed.innerHTML = '';
  const c = cur();
  if (!c || !c.messages.length) {
    addAI(WELCOME, null, { instant: !opts.animateWelcome });
    showChips();
  } else {
    $('chips').innerHTML = '';
    c.messages.forEach(m => m.role === 'user' ? addUser(m.content) : addAI(m.content, null, { instant: true, t: m.t }));
  }
  toEnd();
}
function startNew(opts) {
  if (busy) return toast('Attends la fin de la réponse.');
  store.currentId = null;
  renderChat(opts); renderList(); closeDrawer();
}
function openChat(id) {
  if (busy) return toast('Attends la fin de la réponse.');
  if (!getChat(id)) return;
  store.currentId = id;
  renderChat(); renderList(); closeDrawer();
}
$('newchat').onclick = () => startNew();
$('newbtn').onclick = () => { startNew(); input.focus(); };

/* =========================================================
   ENTRÉE
   ========================================================= */
$('np').textContent = TRACKS.theme.title;
loadStore();
$('enter').onclick = () => {
  startMusic();
  const g = $('gate'); g.classList.add('leave');
  $('app').hidden = false;
  fitViewport();
  startNew({ animateWelcome: true });
  setTimeout(() => { g.hidden = true; }, 700);
};
</script>
