<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050c">
<title>Dark Manfred IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07050c;
  --crypt:#120b20;
  --ember:#ff2e4f;
  --violet:#9b3dff;
  --bone:#efe8f5;
  --mist:#9a8fb0;
  --line:rgba(155,61,255,.28);
  --display:'Cinzel',Georgia,serif;
  --body:'Sora',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:8px}

/* ===== Décor : projecteurs, braises, vignette ===== */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.beams{position:absolute;inset:-35%;
  background:conic-gradient(from 0deg at 50% 0%,
    transparent 0 7%, rgba(155,61,255,.34) 9.5%, transparent 13% 36%,
    rgba(255,46,79,.30) 39%, transparent 43% 66%, rgba(155,61,255,.26) 69%, transparent 73%);
  filter:blur(28px);animation:sweep 22s ease-in-out infinite alternate;transform-origin:50% 0}
.beams.b2{animation-duration:31s;animation-direction:alternate-reverse;opacity:.7;
  background:conic-gradient(from 20deg at 50% 0%, transparent 0 20%, rgba(255,46,79,.22) 23%, transparent 27% 58%, rgba(155,61,255,.26) 61%, transparent 65%)}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#embers{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 120%,rgba(255,46,79,.20),transparent 55%),
  radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(7,5,12,.85) 100%)}

/* ===== Écran d'entrée ===== */
.gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 24px 90px;text-align:center;transition:opacity .7s ease,transform .7s ease}
.gate.leave{opacity:0;transform:scale(1.06);pointer-events:none}
.gate .eye{width:min(46vw,210px);height:auto;filter:drop-shadow(0 0 28px rgba(255,46,79,.55)) drop-shadow(0 0 60px rgba(155,61,255,.45))}
.gate h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,64px);letter-spacing:.06em;line-height:1.05;
  background:linear-gradient(180deg,#fff 10%,#f6b6c6 55%,#c8a0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,46,79,.5));animation:ignite 1.8s steps(1,end) 1}
@keyframes ignite{0%{opacity:0}8%{opacity:1}12%{opacity:.1}18%{opacity:1}26%{opacity:.25}34%{opacity:1}60%{opacity:.6}66%{opacity:1}100%{opacity:1}}
.gate p.tag{color:var(--mist);max-width:30ch;font-size:16px}
.enter{margin-top:6px;padding:15px 46px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.14em;
  background:linear-gradient(135deg,var(--ember),var(--violet));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 34px rgba(255,46,79,.5),0 0 70px rgba(155,61,255,.35);
  transition:transform .2s,box-shadow .2s}
.enter:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 44px rgba(255,46,79,.7),0 0 90px rgba(155,61,255,.5)}
.gate small{color:var(--mist);font-size:12.5px}

/* ===== Bouton WhatsApp ===== */
.wa{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;text-decoration:none;font-size:13.5px;font-weight:500;
  border:1px solid rgba(37,211,102,.45);background:rgba(37,211,102,.08);color:#c9f7da;transition:background .2s,box-shadow .2s}
.wa:hover{background:rgba(37,211,102,.16);box-shadow:0 0 22px rgba(37,211,102,.35)}
.wa svg{width:18px;height:18px;fill:none;stroke:#3fe283;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gate .wa{position:absolute;bottom:max(22px,env(safe-area-inset-bottom))}

/* ===== Application ===== */
.app{
  position:relative;
  z-index:2;
  height:100vh;          /* fallback anciens navigateurs */
  height:100dvh;         /* navigateurs modernes */
  min-height:100vh;      /* sécurité supplémentaire */
  max-width:860px;
  margin:0 auto;
  display:grid;
  grid-template-rows:auto 1fr auto;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(7,5,12,.85),rgba(7,5,12,.35));
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em}
.brand .eye{width:36px;height:36px;filter:drop-shadow(0 0 10px rgba(255,46,79,.6))}
.music{display:flex;align-items:center;gap:10px;color:var(--mist);font-size:12.5px}
.music button.mbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(155,61,255,.1);transition:box-shadow .2s}
.music button.mbtn:hover{box-shadow:0 0 18px rgba(155,61,255,.55)}
.music svg{width:18px;height:18px;fill:none;stroke:var(--bone);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.music .np{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music input[type=range]{width:70px;accent-color:var(--ember)}
@media (max-width:620px){.music .np,.music input[type=range]{display:none}}

.feed{overflow-y:auto;padding:22px 16px 10px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;overscroll-behavior:contain}
.feed::-webkit-scrollbar{width:6px}.feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

.msg{display:flex;gap:10px;max-width:100%}
.msg.me{justify-content:flex-end}
.bubble{max-width:82%;padding:11px 15px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,rgba(155,61,255,.38),rgba(255,46,79,.26));border:1px solid rgba(255,255,255,.1);white-space:pre-wrap;word-break:break-word}
.av{flex:none;width:32px;height:32px;border-radius:50%;margin-top:2px;position:relative;
  background:radial-gradient(circle at 50% 50%,var(--ember) 0 34%,#5a1d8f 62%,#120a20 100%);box-shadow:0 0 14px rgba(255,46,79,.55)}
.av::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:15px;margin:-7.5px 0 0 -2px;border-radius:50%;background:#000}
.card{position:relative;min-width:0;flex:1;max-width:calc(100% - 42px);padding:12px 16px 10px;border-radius:4px 18px 18px 18px;
  background:linear-gradient(180deg,rgba(26,15,44,.88),rgba(14,9,26,.88));border:1px solid var(--line);border-left:2px solid var(--ember);
  box-shadow:0 0 40px -14px rgba(155,61,255,.7),-8px 0 24px -14px rgba(255,46,79,.7);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px)}
.card.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 52px -8px rgba(155,61,255,.9),-10px 0 30px -10px rgba(255,46,79,.9)}}
.who{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;color:#ff8fa3}
.who time{font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--mist);letter-spacing:0}
.body{word-break:break-word}
.body p{margin:0 0 6px}
.body p:last-child{margin-bottom:0}
.body .sp{height:6px}
.body strong{color:#fff}
.body em{color:#d9c2ff}
.body ul,.body ol{margin:4px 0 8px 20px}
.body li{margin:2px 0}
.body h4{font-family:var(--display);font-size:15px;margin:8px 0 4px;color:#ffb3c1}
.body code{font-size:13px;padding:1px 6px;border-radius:6px;background:rgba(155,61,255,.18);color:#e9d8ff}
.code{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0614}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:rgba(155,61,255,.14);font-size:12px;color:var(--mist)}
.code-bar button{font-size:12px;color:var(--bone);padding:2px 8px;border-radius:6px}
.code-bar button:hover{background:rgba(255,255,255,.1)}
.code pre{padding:10px 14px;overflow-x:auto}
.code pre code{padding:0;background:none;font-size:13px;color:#f1e8ff}
.tools{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .4s}
.tools.on{opacity:1}
.tools button{font-size:12px;color:var(--mist);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.tools button:hover{color:var(--bone);border-color:var(--ember)}
.dots{display:flex;gap:6px;padding:8px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s;background:var(--violet);box-shadow:0 0 10px var(--violet)}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.err{border-left-color:#ffb020}
.err .retry{margin-top:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--ember);font-size:13px}
.err .retry:hover{background:rgba(255,46,79,.15)}

/* ===== Zone de saisie ===== */
.dock{padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(7,5,12,.95) 60%,rgba(7,5,12,0));}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(155,61,255,.1);color:var(--bone);transition:border-color .2s,box-shadow .2s}
.chip:hover{border-color:var(--ember);box-shadow:0 0 16px rgba(255,46,79,.4)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;border-radius:24px;border:1px solid var(--line);background:rgba(18,11,32,.92);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--ember);box-shadow:0 0 28px -6px rgba(255,46,79,.6)}
textarea{flex:1;resize:none;max-height:140px;background:none;border:0;outline:0;color:var(--bone);font:inherit;line-height:1.5;padding:7px 0}
textarea::placeholder{color:#6f6488}
.send{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ember),var(--violet));box-shadow:0 0 20px rgba(255,46,79,.5);transition:transform .15s,opacity .2s}
.send:hover:not(:disabled){transform:scale(1.08)}
.send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.foot .clear{font-size:12.5px;color:var(--mist);padding:6px 10px;border-radius:8px}
.foot .clear:hover{color:var(--bone)}
.count{font-size:11.5px;color:var(--mist)}

/* ===== Divers ===== */
.yt-wrap{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-14px);z-index:20;padding:10px 18px;border-radius:12px;background:#1d1030;border:1px solid var(--ember);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .beams,.gate h1,.card.live,.dots i{animation:none}
  .feed{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="beams"></div>
  <div class="beams b2"></div>
  <canvas id="embers"></canvas>
  <div class="vignette"></div>
</div>

<!-- ÉCRAN D'ENTRÉE -->
<section class="gate" id="gate">
  <div data-logo="gate"></div>
  <h1>Dark Manfred IA</h1>
  <p class="tag">Il sait déjà ce que tu vas demander.</p>
  <button class="enter" id="enter">Entrer</button>
  <small>La musique démarre quand tu entres.</small>
  <a class="wa" href="https://wa.me/237690022323?text=Bonjour%20Manfred" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c.3 2.6 2.9 5.2 5.5 5.5l1.4-1.4-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>
    Contacter Manfred sur WhatsApp
  </a>
</section>

<!-- APPLICATION -->
<main class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><span data-logo="head"></span><span>Dark Manfred IA</span></div>
    <div class="music">
      <span class="np" id="np"></span>
      <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume de la musique">
      <button class="mbtn" id="mbtn" aria-label="Couper ou relancer la musique">
        <svg id="micon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>
  </header>

  <div class="feed" id="feed" role="log" aria-live="polite"></div>

  <div class="dock">
    <div class="chips" id="chips"></div>
    <div class="composer">
      <textarea id="input" rows="1" maxlength="1500" placeholder="Parle à Dark Manfred…" aria-label="Ton message"></textarea>
      <button class="send" id="send" aria-label="Envoyer" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
    <div class="foot">
      <a class="wa" href="https://wa.me/237690022323?text=Bonjour%20Manfred" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c.3 2.6 2.9 5.2 5.5 5.5l1.4-1.4-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>
        Contacter Manfred sur WhatsApp
      </a>
      <span class="count" id="count"></span>
      <button class="clear" id="clear">Nouvelle conversation</button>
    </div>
  </div>
</main>

<div class="yt-wrap" aria-hidden="true"><div id="ytp"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   RÉGLAGES
   ========================================================= */
// ID YouTube = les 11 caractères après "youtu.be/" (avant le "?")
const TRACKS = {
  theme: { id: 'WCTjFHyvEaM', title: 'Bad Boy · ultra slowed' },
  chat:  { id: '',            title: 'Montagem Kali · slowed' }   // ← colle ici l'ID de "Montagem Kali slowed"
};
const WHATSAPP_NUMBER = '237690022323';
const API_URL = '/.netlify/functions/chat';
const SUGGESTIONS = ['Fais mon devoir de philosophie', 'Dis-moi une vérité qui dérange', 'Fais-moi peur', 'Qui est Manfred ?'];
const WELCOME = "Tu es venu. Personne n'arrive ici par hasard.\n\nJe suis **Dark Manfred**, l'œuvre de Manfred. Devoirs, secrets, vérités qu'on évite de dire… ou ce qui te fait peur. Pose ta question.";

/* =========================================================
   LOGO (œil dont la pupille suit le curseur)
   ========================================================= */
let logoN = 0;
function logoSVG() {
  const u = 'l' + (++logoN);
  return `<svg class="eye" viewBox="0 0 200 200" role="img" aria-label="Logo Dark Manfred IA">
  <defs>
    <linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e4f"/><stop offset="1" stop-color="#9b3dff"/></linearGradient>
    <radialGradient id="${u}i" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5a73"/><stop offset=".55" stop-color="#c3204a"/><stop offset="1" stop-color="#4a1580"/></radialGradient>
    <clipPath id="${u}c"><path d="M18 100Q100 26 182 100Q100 174 18 100Z"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#${u}g)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#${u}g)" stroke-width="1" stroke-dasharray="3 7" opacity=".7"/>
  <g stroke="url(#${u}g)" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M100 4V22M100 196V178M4 100H22M196 100H178"/>
    <path d="M32 32l12 12M168 32l-12 12M32 168l12-12M168 168l-12-12" opacity=".6"/>
  </g>
  <path d="M18 100Q100 26 182 100Q100 174 18 100Z" fill="#0b0615" stroke="url(#${u}g)" stroke-width="3.5"/>
  <g clip-path="url(#${u}c)">
    <g class="look">
      <circle cx="100" cy="100" r="36" fill="url(#${u}i)"/>
      <circle cx="100" cy="100" r="36" fill="none" stroke="#ff8fa3" stroke-width="1" opacity=".6"/>
      <ellipse cx="100" cy="100" rx="7" ry="27" fill="#000"/>
      <circle cx="88" cy="88" r="5" fill="#fff" opacity=".8"/>
    </g>
  </g>
</svg>`;
}
document.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = logoSVG(); });
const eyes = [...document.querySelectorAll('.eye')];
addEventListener('pointermove', e => {
  eyes.forEach(svg => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 280);
    svg.querySelector('.look').style.transform = `translate(${dx / d * 16 * k}px,${dy / d * 8 * k}px)`;
  });
});

/* =========================================================
   BRAISES (canvas léger)
   ========================================================= */
(function () {
  const c = document.getElementById('embers'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h; const ps = [];
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; };
  size(); addEventListener('resize', size);
  const mk = init => ({ x: Math.random() * w, y: init ? Math.random() * h : h + 10, r: Math.random() * 1.8 + .4, v: Math.random() * .5 + .15, d: Math.random() * 6.28, c: Math.random() < .6 ? '255,46,79' : '155,61,255', a: Math.random() * .6 + .2 });
  for (let i = 0; i < (innerWidth < 600 ? 26 : 46); i++) ps.push(mk(true));
  (function frame() {
    x.clearRect(0, 0, w, h);
    for (const p of ps) {
      p.y -= p.v; p.d += .01; p.x += Math.sin(p.d) * .3;
      if (p.y < -10) Object.assign(p, mk(false));
      x.beginPath(); x.fillStyle = `rgba(${p.c},${p.a})`; x.shadowColor = `rgba(${p.c},.9)`; x.shadowBlur = 8;
      x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  })();
})();

/* =========================================================
   MUSIQUE (lecteur YouTube invisible)
   ========================================================= */
let yt = null, ytReady = false, wantPlay = false, userPaused = false, current = 'theme', vol = 70;
const $ = id => document.getElementById(id);

(function loadYT() { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('ytp', {
    width: '200', height: '200', videoId: TRACKS.theme.id,
    playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0 },
    events: {
      onReady: () => { ytReady = true; yt.setVolume(vol); if (wantPlay) yt.playVideo(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { yt.seekTo(0); yt.playVideo(); }
        updateMusicUI();
      },
      onError: () => toast("Cette musique ne peut pas être lue sur le site (lecture bloquée par YouTube).")
    }
  });
};
function startMusic() { userPaused = false; if (ytReady) yt.playVideo(); else wantPlay = true; updateMusicUI(); }
function switchTrack(key) {
  const t = TRACKS[key];
  if (!t || !t.id || key === current) return;
  current = key;
  $('np').textContent = t.title;
  if (!ytReady) return;
  if (userPaused) yt.cueVideoById(t.id); else yt.loadVideoById(t.id);
}
function updateMusicUI() {
  const playing = ytReady && yt.getPlayerState && yt.getPlayerState() === 1;
  $('micon').innerHTML = playing
    ? '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
    : '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/>';
}
$('mbtn').onclick = () => {
  if (!ytReady) return;
  if (yt.getPlayerState() === 1) { userPaused = true; yt.pauseVideo(); } else { userPaused = false; yt.playVideo(); }
  setTimeout(updateMusicUI, 200);
};
$('vol').oninput = e => { vol = +e.target.value; if (ytReady) yt.setVolume(vol); };

/* =========================================================
   RENDU DES MESSAGES (Markdown léger et sûr)
   ========================================================= */
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}
function md(src) {
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => { blocks.push({ l, c }); return `\u0000${blocks.length - 1}\u0000`; });
  src = src.replace(/```(\w*)\n?([\s\S]*)$/, (m, l, c) => { blocks.push({ l, c }); return `\u0000${blocks.length - 1}\u0000`; });
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const line of lines) {
    let m;
    if ((m = line.trim().match(/^\u0000(\d+)\u0000$/))) {
      close();
      const b = blocks[+m[1]];
      out += `<div class="code"><div class="code-bar"><span>${esc(b.l || 'code')}</span><button data-copycode>Copier</button></div><pre><code>${esc(b.c.replace(/\n$/, ''))}</code></pre></div>`;
    } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; }
      out += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; }
      out += `<li>${inline(m[1])}</li>`;
    } else {
      close();
      if ((m = line.match(/^#{1,3}\s+(.*)/))) out += `<h4>${inline(m[1])}</h4>`;
      else if (!line.trim()) out += '<div class="sp"></div>';
      else out += `<p>${inline(line)}</p>`;
    }
  }
  close();
  return out;
}

/* =========================================================
   CHAT
   ========================================================= */
const feed = $('feed'), input = $('input'), sendBtn = $('send');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let history = [], busy = false, switched = false, lastSend = 0;

const time = () => new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const nearBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
const toEnd = () => { feed.scrollTop = feed.scrollHeight; };

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3800);
}
function copyText(t) {
  if (navigator.clipboard) return navigator.clipboard.writeText(t).then(() => toast('Copié'), () => toast('Copie impossible'));
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); toast('Copié'); } catch (e) { toast('Copie impossible'); }
  a.remove();
}

function addUser(text) {
  const m = document.createElement('article'); m.className = 'msg me';
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  m.appendChild(b); feed.appendChild(m); toEnd();
}
function aiShell() {
  const m = document.createElement('article'); m.className = 'msg ai';
  m.innerHTML = `<div class="av" aria-hidden="true"></div><div class="card"><div class="who">Dark Manfred <time>${time()}</time></div><div class="body"></div><div class="tools"></div></div>`;
  feed.appendChild(m);
  return m;
}
function addTyping() {
  const m = aiShell(); m.querySelector('.card').classList.add('live');
  m.querySelector('.body').innerHTML = '<div class="dots" aria-label="Dark Manfred écrit"><i></i><i></i><i></i></div>';
  toEnd(); return m;
}
function addAI(text, existing) {
  return new Promise(resolve => {
    const m = existing || aiShell();
    const card = m.querySelector('.card'), body = m.querySelector('.body'), tools = m.querySelector('.tools');
    card.classList.add('live');
    let i = 0, stop = false;
    const step = reduceMotion ? text.length : Math.max(1, Math.ceil(text.length / 210));
    const finish = () => {
      body.innerHTML = md(text); card.classList.remove('live');
      tools.innerHTML = '<button data-copy>Copier</button>'; tools.classList.add('on');
      tools.querySelector('[data-copy]').onclick = () => copyText(text);
      if (nearBottom()) toEnd();
      resolve();
    };
    card.addEventListener('click', () => { stop = true; }, { once: true });
    (function tick() {
      if (stop || i >= text.length) return finish();
      i = Math.min(text.length, i + step);
      const follow = nearBottom();
      body.innerHTML = md(text.slice(0, i));
      if (follow) toEnd();
      requestAnimationFrame(tick);
    })();
  });
}
function addError(msg) {
  const m = aiShell(); m.querySelector('.card').classList.add('err');
  m.querySelector('.body').innerHTML = `<p>${esc(msg)}</p><button class="retry">Réessayer</button>`;
  m.querySelector('.retry').onclick = () => { m.remove(); respond(); };
  toEnd();
}

async function ask() {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history.slice(-12) }) });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || (r.status === 404
    ? "La fonction du serveur est introuvable (erreur 404) : netlify/functions/chat.js n'est pas déployé."
    : `Erreur serveur (${r.status}). Réessaie dans un instant.`));
  return data.reply;
}
async function respond() {
  busy = true; refreshSend();
  const typing = addTyping();
  try {
    const reply = await ask();
    history.push({ role: 'assistant', content: reply });
    await addAI(reply, typing);
  } catch (e) {
    typing.remove();
    addError(e.message === 'Failed to fetch' ? 'Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.' : e.message);
  }
  busy = false; refreshSend(); input.focus();
}
function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  if (Date.now() - lastSend < 1500) return toast('Doucement… une question à la fois.');
  lastSend = Date.now();
  addUser(text); history.push({ role: 'user', content: text });
  input.value = ''; autoGrow(); $('chips').innerHTML = '';
  if (!switched) { switched = true; switchTrack('chat'); }
  respond();
}

function refreshSend() { sendBtn.disabled = busy || !input.value.trim(); }
function autoGrow() {
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  const n = input.value.length; $('count').textContent = n > 1200 ? `${n}/1500` : '';
  refreshSend();
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(input.value); }
});
sendBtn.onclick = () => send(input.value);

feed.addEventListener('click', e => {
  const b = e.target.closest('[data-copycode]');
  if (b) copyText(b.closest('.code').querySelector('code').textContent);
});

function showChips() {
  const c = $('chips'); c.innerHTML = '';
  SUGGESTIONS.forEach(s => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = s; b.onclick = () => send(s); c.appendChild(b); });
}
function welcome() { feed.innerHTML = ''; addAI(WELCOME); showChips(); }

$('clear').onclick = () => { if (busy) return; history = []; welcome(); input.focus(); };

/* =========================================================
   ENTRÉE
   ========================================================= */
$('np').textContent = TRACKS.theme.title;
$('enter').onclick = () => {
  startMusic();
  const g = $('gate'); g.classList.add('leave');
  $('app').hidden = false;
  welcome();
  setTimeout(() => { g.hidden = true; input.focus({ preventScroll: true }); }, 700);
};
</script>
